<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Christopher Okoh — Full-Stack & AI Engineer</title>
<style>
:root{--bg:#060b17;--bg2:#0a1121;--card:#0c1426;--text:#f1f5fd;--muted:#93a1bd;--line:#1a2640;--blue:#3b6cff;--cy:#38a0ff;--ind:#5b5cf0;--ok:#22c55e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f7fc;--bg2:#eaeff8;--card:#fff;--text:#0f172a;--muted:#55627a;--line:#d9e0ee;--blue:#2556e8;--cy:#0b74d9;--ind:#4338ca}}
:root[data-theme="light"]{--bg:#f4f7fc;--bg2:#eaeff8;--card:#fff;--text:#0f172a;--muted:#55627a;--line:#d9e0ee;--blue:#2556e8;--cy:#0b74d9;--ind:#4338ca}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.w{max-width:1100px;margin:auto;padding:0 22px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
nav .w{display:flex;align-items:center;gap:26px;height:62px;overflow-x:auto;white-space:nowrap}
.logo{font-weight:700;display:flex;gap:10px;align-items:center;margin-right:auto}.logo b{color:var(--cy);font-size:22px}
nav a.l{font-size:14px;color:var(--muted);padding:20px 0}nav a.l:hover,nav a.on{color:var(--text)}nav a.on{border-bottom:2px solid var(--cy)}
.ob{border:1px solid var(--blue);border-radius:99px;padding:8px 18px;font-size:14px;font-weight:600;background:none;color:var(--text);cursor:pointer}
.btn{display:inline-flex;gap:8px;align-items:center;border-radius:99px;padding:11px 24px;font-weight:600;font-size:14px;border:1px solid var(--blue);transition:.2s}
.btn.p{background:var(--blue);color:#fff}.btn:hover{transform:translateY(-2px)}
.eb{color:var(--cy);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
h2{font-size:24px;margin:6px 0 10px;line-height:1.25}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:30px;align-items:center;padding:70px 0 56px;background:radial-gradient(500px 300px at 80% 60%,#3b6cff2e,transparent 70%)}
.hero h1{font-size:clamp(38px,6vw,56px);line-height:1.1;margin:6px 0;letter-spacing:-.02em}.hero h1 span{color:var(--ind)}
.hero h3{font-size:21px;font-weight:500;margin:0 0 14px}.hero p{color:var(--cy);max-width:470px;font-size:16px}
.soc{display:flex;gap:12px;margin-top:22px}.soc a{width:36px;height:36px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--cy)}
.ph{position:relative;max-width:300px;margin:auto}
.pic{aspect-ratio:1;border-radius:20px;border:1px solid var(--blue);background:linear-gradient(145deg,#1b2a8a,#0a1020 70%);display:grid;place-items:center;font-size:84px;font-weight:800;color:#ffffffcc;box-shadow:0 0 60px #3b6cff55;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.open{position:absolute;right:-30px;bottom:-26px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:12px;display:flex;gap:10px;align-items:center}
.open i{width:10px;height:10px;border-radius:50%;background:var(--ok)}.open small{color:var(--muted);display:block;font-size:10.5px}
.note{position:absolute;right:-50px;top:-8px;font:italic 15px "Segoe Script","Bradley Hand",cursive;color:var(--muted);transform:rotate(-8deg);line-height:1.3}
.sec{padding:52px 0;border-top:1px solid var(--line)}.sec.alt{background:var(--bg2)}
.about{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:34px;align-items:center}
.about p{color:var(--muted)}
.info div{display:flex;gap:14px;margin-bottom:16px;font-size:13.5px}.info em{font-style:normal;font-size:20px}.info b{display:block;font-weight:500}.info span{color:var(--muted);font-size:12.5px}
.quote{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:30px;color:var(--cy);font-style:italic;font-size:17px;font-weight:600}.quote small{display:block;color:var(--muted);font-weight:400;margin-top:18px;font-size:13px}
.ph2{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}.ph2 p{color:var(--muted);margin:0;max-width:440px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;transition:.25s;display:flex;flex-direction:column}.pc:hover{transform:translateY(-5px);border-color:var(--blue)}
.th{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:16/8;background:#0b1120}.th img,.th svg{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.fe{position:absolute;right:8px;top:8px;background:var(--blue);color:#fff;font-size:11px;padding:2px 9px;border-radius:6px}
.pc h4{margin:14px 4px 4px;font-size:16px}.pc>p{margin:0 4px 10px;color:var(--muted);font-size:13px}
.tg{margin:0 4px}.tg span{display:inline-block;background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:2px 12px;font-size:12px;margin:0 5px 6px 0}
.lk{margin:8px 4px;font-size:13px;display:flex;gap:18px;color:var(--cy)}.lk em{color:var(--muted);font-style:normal}
.pc ul{margin:4px 4px 6px;padding-left:18px;color:var(--muted);font-size:12.5px}
.tri{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:34px}
.sk{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 18px;margin-top:14px}.sk h5{margin:0 0 8px;font-weight:500;color:var(--muted);font-size:12.5px}
.sk span{display:block;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:3px 10px;font-size:12px;margin-bottom:6px}
.tl>div{display:flex;gap:12px;margin:14px 0;font-size:13.5px;align-items:flex-start}.tl>div:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--blue);margin-top:6px;box-shadow:0 0 0 3px #3b6cff33;flex:none}
.tl b{display:block;font-weight:600}.tl small{color:var(--muted)}.st{margin-left:auto;font-size:11px;padding:2px 10px;border-radius:6px;background:#22c55e22;color:var(--ok);white-space:nowrap}
.ac{display:flex;gap:12px;margin:14px 0;font-size:13.5px}.ac i{width:38px;height:38px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-style:normal;flex:none}
.ac b{display:block;font-weight:600}.ac small{color:var(--muted)}

.ct{display:grid;grid-template-columns:1fr 1.15fr;gap:48px;align-items:start}
.contact-copy{padding:8px 0}.contact-copy h2{font-size:32px;margin:8px 0 12px}.contact-copy>p{color:var(--muted);max-width:420px;margin:0 0 26px}
.contact-details{display:grid;gap:12px;margin-top:22px}.contact-detail{display:flex;align-items:center;gap:12px;color:var(--text);font-size:13px}.contact-detail .ci{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line);background:var(--card);border-radius:10px}.contact-detail small{display:block;color:var(--muted);font-size:11px;margin-bottom:1px}.contact-detail a{color:var(--text)}.contact-detail a:hover{color:var(--cy)}
.contact-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 18px 50px #00000018}.contact-card h3{margin:0 0 5px;font-size:18px}.contact-card>p{margin:0 0 18px;color:var(--muted);font-size:12.5px}.contact-form{display:grid;gap:12px}.contact-form .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.contact-form label{display:grid;gap:6px;font-size:11.5px;color:var(--muted)}.contact-form input,.contact-form textarea{width:100%;border:1px solid var(--line);background:var(--bg2);color:var(--text);border-radius:9px;padding:10px 11px;font:inherit;font-size:13px;outline:none}.contact-form input:focus,.contact-form textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #3b6cff22}.contact-form textarea{min-height:110px;resize:vertical}.contact-submit{width:100%;justify-content:center}.form-note{font-size:10.5px;color:var(--muted);margin:0}.form-error{display:none;color:#f87171;font-size:11.5px;margin:0}.form-error.show{display:block}
footer{border-top:1px solid var(--line);padding:18px 0;color:var(--muted);font-size:12px}footer .w{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}footer a{margin-left:18px}
@media(max-width:900px){.hero,.about,.cards,.tri,.ct{grid-template-columns:1fr}.open{right:0}.note{display:none}.sk{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.contact-form .row{grid-template-columns:1fr}.contact-card{padding:20px}.contact-copy h2{font-size:28px}}
</style>
</head>
